# Опис інфраструктури для хмарної платформи Render (ІЗ1, крок 1).
services:
  - type: web
    name: iz-reviews
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iz-reviews-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HF_API_TOKEN
        sync: false        # задається вручну в налаштуваннях сервісу
      - key: ADMIN_TOKEN
        generateValue: true     # потрібен для дій, що змінюють дані
      - key: BEHIND_PROXY
        value: "1"              # Render працює за проксі: справжня IP клієнта
      - key: FORCE_HTTPS
        value: "1"              # куки сесії лише через HTTPS
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: iz-reviews-db
    plan: free
    region: frankfurt
    databaseName: reviews
    user: izuser
