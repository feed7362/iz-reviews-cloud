# Опис інфраструктури для хмарної платформи Render (ІЗ1, крок 1).
services:
  - type: web
    name: iz-reviews
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iz-reviews-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HF_API_TOKEN
        sync: false        # задається вручну в налаштуваннях сервісу
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: iz-reviews-db
    plan: free
    region: frankfurt
    databaseName: reviews
    user: izuser
